name: CI

on:
  pull_request:
    branches: [main]

  # Practice trigger — only fires on main, runs indefinitely until removed.
  # Remove this block once you're done observing it.
  schedule:
    - cron: '*/15 * * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Secrets are injected as env vars here, never referenced inline in a run step —
    # that keeps them out of shell expansion and out of the workflow logs.
    env:
      CI: true
      DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm test

      # Runs even if the test step above failed, so the report is still available for inspection.
      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
